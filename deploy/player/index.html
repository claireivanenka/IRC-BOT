<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRC-BOT Music Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        header h1 {
            font-size: 2.5rem;
            color: #00d4ff;
            margin-bottom: 10px;
        }
        
        header p {
            color: #a0a0a0;
            font-size: 1.1rem;
        }
        
        .player-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .now-playing {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        
        .track-info {
            margin-bottom: 20px;
        }
        
        .track-info h2 {
            font-size: 1.5rem;
            color: #00d4ff;
            margin-bottom: 10px;
        }
        
        .track-info p {
            color: #a0a0a0;
            margin: 5px 0;
        }
        
        .track-meta span {
            display: inline-block;
            margin-right: 15px;
            color: #888;
        }
        
        .progress-container {
            margin-bottom: 20px;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            cursor: pointer;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #0099cc);
            border-radius: 3px;
            width: 0%;
        }
        
        .time-display {
            display: flex;
            justify-content: space-between;
            color: #888;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        
        .player-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        
        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0, 212, 255, 0.2);
            border: none;
            color: #00d4ff;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            transition: all 0.3s;
        }
        
        .control-btn:hover {
            background: rgba(0, 212, 255, 0.4);
            transform: scale(1.1);
        }
        
        .control-btn.play-pause {
            width: 60px;
            height: 60px;
            font-size: 1.8rem;
        }
        
        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .volume-bar {
            width: 100px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        
        .volume {
            height: 100%;
            background: #00d4ff;
            border-radius: 3px;
            width: 50%;
        }
        
        .track-list {
            flex: 2;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(10px);
            max-height: 600px;
            overflow-y: auto;
        }
        
        .track-list h3 {
            color: #00d4ff;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }
        
        .track-item {
            padding: 12px;
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .track-item:hover {
            background: rgba(0, 212, 255, 0.2);
        }
        
        .track-item.playing {
            background: rgba(0, 212, 255, 0.3);
        }
        
        .track-number {
            width: 30px;
            color: #888;
            font-size: 0.9rem;
        }
        
        .track-details {
            flex: 1;
        }
        
        .track-title {
            font-weight: 600;
            color: #fff;
            margin-bottom: 3px;
        }
        
        .track-artist {
            color: #a0a0a0;
            font-size: 0.9rem;
        }
        
        .track-duration {
            color: #888;
            font-size: 0.9rem;
            min-width: 60px;
            text-align: right;
        }
        
        .track-plays {
            color: #00d4ff;
            font-size: 0.8rem;
            min-width: 50px;
            text-align: right;
        }
        
        .search-box {
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        
        .search-box input::placeholder {
            color: #888;
        }
        
        .filter-bar {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            color: #a0a0a0;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .filter-btn:hover {
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
        }
        
        .filter-btn.active {
            background: #00d4ff;
            color: #000;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #888;
        }
        
        .error {
            text-align: center;
            padding: 20px;
            color: #ff5555;
        }
        
        .spinner {
            border: 3px solid rgba(0, 212, 255, 0.3);
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .player-container {
                flex-direction: column;
            }
            
            header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 IRC-BOT Music Player</h1>
            <p>Écoutez et gérez votre bibliothèque musicale depuis IRC</p>
        </header>
        
        <div class="player-container">
            <div class="now-playing">
                <div class="track-info">
                    <h2 id="current-title">Aucune piste sélectionnée</h2>
                    <div class="track-meta">
                        <span id="current-artist">Artiste: -</span>
                        <span id="current-album">Album: -</span>
                    </div>
                    <div class="track-meta">
                        <span id="current-genre">Genre: -</span>
                        <span id="current-year">Année: -</span>
                        <span id="current-plays">Lectures: 0</span>
                    </div>
                </div>
                
                <div class="progress-container">
                    <div class="progress-bar" id="progress-bar">
                        <div class="progress" id="progress"></div>
                    </div>
                    <div class="time-display">
                        <span id="current-time">0:00</span>
                        <span id="duration">0:00</span>
                    </div>
                </div>
                
                <div class="player-controls">
                    <button class="control-btn" id="prev-btn" title="Précédent">⏮</button>
                    <button class="control-btn play-pause" id="play-pause-btn" title="Lecture/Pause">▶</button>
                    <button class="control-btn" id="next-btn" title="Suivant">⏭</button>
                    <a class="control-btn" id="download-btn" title="Télécharger" download>⬇</a>
                    <div class="volume-control">
                        <span>🔈</span>
                        <div class="volume-bar" id="volume-bar">
                            <div class="volume" id="volume"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="track-list">
                <h3>Bibliothèque musicale</h3>
                
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Rechercher une piste...">
                </div>
                
                <div class="filter-bar">
                    <button class="filter-btn active" data-filter="all">Tous</button>
                    <button class="filter-btn" data-filter="recent">Récents</button>
                    <button class="filter-btn" data-filter="popular">Populaires</button>
                </div>
                
                <div id="track-list-container">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Chargement de la bibliothèque...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <audio id="audio-player"></audio>
    
    <script src="player.js"></script>
</body>
</html>
