# Configuration nginx pour le serveur de musique IRC-BOT
# Version simplifiée pour test local

server {
    listen 8080;
    server_name localhost;
    
    root /var/www/irc_bot/music;
    index index.html;
    
    # CORS headers pour le player
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # Player web
    location /music/player/ {
        alias /var/www/irc_bot/music/player/;
        try_files $uri $uri/ /music/player/index.html;
        
        types {
            text/html html;
            application/javascript js;
            text/css css;
        }
    }
    
    # Streaming des fichiers audio depuis le répertoire musique
    location /music/stream/ {
        alias /var/lib/irc_bot/music/;
        
        # Types MIME audio
        types {
            audio/mpeg mp3;
            audio/flac flac;
            audio/ogg ogg oga;
            audio/mp4 m4a;
            audio/wav wav;
        }
        
        # Streaming optimisé
        sendfile on;
        tcp_nopush on;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "no-cache";
        
        # Essayer de trouver le fichier
        try_files $uri =404;
    }
    
    # Téléchargement direct
    location /music/dl/ {
        alias /var/lib/irc_bot/music/;
        
        types {
            audio/mpeg mp3;
            audio/flac flac;
            audio/ogg ogg oga;
            audio/mp4 m4a;
            audio/wav wav;
        }
        
        sendfile on;
        add_header Content-Disposition 'attachment';
        
        try_files $uri =404;
    }
    
    # API pour le player (sera géré par music_api.lua)
    location /music/api/ {
        proxy_pass http://localhost:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Support du WebSocket si nécessaire
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # Logging
    access_log /var/log/nginx/music.access.log;
    error_log /var/log/nginx/music.error.log;
}
