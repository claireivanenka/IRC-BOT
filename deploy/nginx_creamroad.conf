# =====================================================================
# Configuration nginx pour CreamRoad
# Serveur de fichiers statiques pour audio, video et covers
# =====================================================================

# Ce fichier peut être inclus dans votre configuration nginx principale
# ou copié dans /etc/nginx/sites-available/

# Exemple d'utilisation:
# 1. Copiez ce fichier dans /etc/nginx/sites-available/creamroad
# 2. Créez un lien symbolique: ln -s /etc/nginx/sites-available/creamroad /etc/nginx/sites-enabled/
# 3. Redémarrez nginx: sudo systemctl restart nginx

server {
    listen 80;
    server_name creamroad.votredomaine.com;
    # server_name localhost;  # Pour les tests locaux
    
    root /home/claire/IRC-BOT/CremRoad - Sep 2026;
    index index.html;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/x-font-ttf application/x-font-opentype image/svg+xml;
    gzip_min_length 1000;
    
    # Cache pour les fichiers statiques
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
    
    # Cache pour les fichiers audio
    location ~* \.(mp3|flac|ogg|wav|m4a|aac|opus)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Content-Type audio/mpeg;
        access_log off;
        
        # Permettre le streaming (seeking)
        add_header Accept-Ranges bytes;
    }
    
    # Cache pour les fichiers vidéo
    location ~* \.(mp4|mkv|avi|mov|wmv|flv|webm)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Content-Type video/mp4;
        access_log off;
        
        # Permettre le streaming vidéo
        add_header Accept-Ranges bytes;
    }
    
    # Éviter l'accès direct aux fichiers sensibles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Bloquer l'accès aux répertoires
    location ~* /$ {
        # Rediriger vers index.html pour les répertoires
        try_files $uri $uri/ /index.html;
    }
    
    # Permission pour index.html
    location = / {
        try_files /index.html =404;
    }
    
    # Gérer les erreurs 404
    location @not_found {
        return 404 '{"error": "File not found"}';
    }
    
    # Accès direct aux fichiers
    location / {
        try_files $uri $uri/ @not_found;
        
        # CORS pour permettre l'accès depuis d'autres domaines
        add_header 'Access-Control-Allow-Origin' '*', always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS', always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range', always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range', always;
        
        # Permettre les requêtes OPTIONS
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
    
    # Configuration pour le streaming audio
    location /audio/ {
        # Répertoire des fichiers audio
        alias /home/claire/IRC-BOT/CremRoad - Sep 2026/audio/;
        
        # Streaming support
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=31536000, immutable";
        
        # CORS
        add_header 'Access-Control-Allow-Origin' '*', always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS', always;
        add_header 'Access-Control-Allow-Headers' 'Range', always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,Accept-Ranges', always;
        
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
    
    # Configuration pour les covers
    location /covers/ {
        alias /home/claire/IRC-BOT/CremRoad - Sep 2026/covers/;
        
        # Cache pour les images
        expires 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header 'Access-Control-Allow-Origin' '*', always;
    }
    
    # Configuration pour les vidéos
    location /video/ {
        alias /home/claire/IRC-BOT/CremRoad - Sep 2026/video/;
        
        # Streaming vidéo
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=31536000, immutable";
        
        # CORS
        add_header 'Access-Control-Allow-Origin' '*', always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS', always;
        add_header 'Access-Control-Allow-Headers' 'Range', always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,Accept-Ranges', always;
        
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
    
    # Configuration pour les métadonnées (accès limité)
    location /metadata/ {
        alias /home/claire/IRC-BOT/CremRoad - Sep 2026/metadata/;
        # Ne pas autoriser l'accès direct aux fichiers JSON
        deny all;
        return 403;
    }
}

