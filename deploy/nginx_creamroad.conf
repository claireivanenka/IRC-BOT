# =====================================================================
# Configuration nginx pour CreamRoad
# Serveur de fichiers statiques pour audio, video et covers
# Intégré au site principal sur /creamroad/
# =====================================================================

server {
    listen 80;
    server_name localhost creamroad;

    # Root principal pour CreamRoad
    root "/home/claire/IRC-BOT/CremRoad - Sep 2026";
    index index.html;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/x-font-ttf application/x-font-opentype image/svg+xml;
    gzip_min_length 1000;
    
    # Location principale pour CreamRoad
    location /creamroad/ {
        alias "/home/claire/IRC-BOT/CremRoad - Sep 2026/";
        
        # Gérer index.html
        index index.html;
        
        # CORS pour permettre l'accès depuis d'autres domaines
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Access-Control-Allow-Headers "Range, DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type";
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range,Accept-Ranges";
        
        # Permettre les requêtes OPTIONS
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
    
    # Fichiers audio - Streaming
    location /creamroad/audio/ {
        alias "/home/claire/IRC-BOT/CremRoad - Sep 2026/audio/";
        
        # Streaming support (pour seeking)
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=31536000, immutable";
        
        # CORS
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Access-Control-Allow-Headers "Range";
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range,Accept-Ranges";
        
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
    
    # Fichiers video - Streaming
    location /creamroad/video/ {
        alias "/home/claire/IRC-BOT/CremRoad - Sep 2026/video/";
        
        # Streaming vidéo
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=31536000, immutable";
        
        # Types MIME pour vidéos
        location ~* \.(mp4|mkv|avi|mov|wmv|flv|webm)$ {
            add_header Content-Type "";
            types { video/mp4 mp4; video/webm webm; }
        }
        
        # CORS
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Access-Control-Allow-Headers "Range";
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range,Accept-Ranges";
        
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
    
    # Covers (images)
    location /creamroad/covers/ {
        alias "/home/claire/IRC-BOT/CremRoad - Sep 2026/covers/";
        
        # Cache pour les images
        expires 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin *;
    }
    
    # Songbook
    location /creamroad/songbook/ {
        alias "/home/claire/IRC-BOT/CremRoad - Sep 2026/songbook/";
        add_header Access-Control-Allow-Origin *;
    }
    
    # Métadonnées - Accès interdit
    location /creamroad/metadata/ {
        deny all;
        return 403;
    }
    
    # Bloquer l'accès aux fichiers cachés
    location ~ /creamroad/\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Gérer les erreurs 404
    location @creamroad_not_found {
        return 404 '{"error": "File not found in CreamRoad"}';
    }
}
