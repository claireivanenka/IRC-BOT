# Configuration nginx pour le serveur de musique IRC-BOT
# Version: 1.0.0

# Ce fichier doit être placé dans /etc/nginx/sites-available/music.conf
# Puis créer un lien symbolique dans /etc/nginx/sites-enabled/

# Configuration globale pour le streaming audio
upstream music_backend {
    # Si vous avez un backend Lua pour générer des playlists JSON
    # server localhost:8080;
    # Pour l'instant, le bot IRC gère directement la base
}

server {
    listen 80;
    server_name music.yourdomain.tld;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name music.yourdomain.tld;
    
    # SSL Configuration (remplacez par vos certificats)
    ssl_certificate /etc/letsencrypt/live/music.yourdomain.tld/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music.yourdomain.tld/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    
    # Racine du site
    root /var/www/music;
    index index.html;
    
    # CORS headers pour le player
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # Serveur de fichiers statiques (fichiers audio)
    location /files/ {
        alias /var/www/music/files/;
        
        # Types MIME audio
        types {
            audio/mpeg mp3;
            audio/flac flac;
            audio/ogg ogg oga;
            audio/mp4 m4a;
            audio/wav wav;
        }
        
        # Autoriser la lecture de fichiers
        sendfile on;
        tcp_nopush on;
        
        # Support du byte-range pour le seeking
        accept_ranges on;
        
        # Cache
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Téléchargement direct via hash (format: /dl/<hash>/<nom_fichier>)
    location ~ ^/dl/([a-f0-9]{64})/(.*) {
        # Vérifier que le hash correspond à un fichier dans la base
        # Pour l'instant, on suppose que le fichier existe
        # Dans une implémentation complète, on pourrait appeler un endpoint Lua
        
        # Mapper le hash au fichier réel
        alias /var/www/music/files/$2;
        
        # Forcer le téléchargement
        add_header Content-Disposition 'attachment; filename="$2"';
        
        # Types MIME
        types {
            audio/mpeg mp3;
            audio/flac flac;
            audio/ogg ogg oga;
            audio/mp4 m4a;
            audio/wav wav;
        }
        
        sendfile on;
        accept_ranges on;
    }
    
    # Streaming direct via hash
    location ~ ^/stream/([a-f0-9]{64}) {
        # Streaming avec Content-Disposition inline
        alias /var/www/music/files/;
        
        # Vérifier que le fichier existe
        try_files $uri =404;
        
        # Types MIME
        types {
            audio/mpeg mp3;
            audio/flac flac;
            audio/ogg ogg oga;
            audio/mp4 m4a;
            audio/wav wav;
        }
        
        # Streaming optimisé
        sendfile on;
        tcp_nopush on;
        accept_ranges on;
        
        # Support du seeking
        add_header Accept-Ranges bytes;
        
        # Pas de cache pour le streaming
        add_header Cache-Control "no-cache";
    }
    
    # Endpoint JSON pour lister les pistes (pour le player web)
    location /api/tracks {
        # Dans une implémentation complète, cela serait géré par un script Lua
        # Pour l'instant, on retourne une réponse statique
        # Le bot IRC peut générer un fichier JSON temporaire
        
        # Exemple avec un script Lua CGI
        # fastcgi_pass unix:/var/run/fcgiwrap.socket;
        # include fastcgi_params;
        
        # Pour l'instant, redirige vers une URL qui n'existe pas
        # Le bot IRC devra générer le JSON via une autre méthode
        return 404 "JSON API not yet implemented";
    }
    
    # Player web
    location / {
        try_files $uri $uri/ /index.html;
        
        # Types MIME pour le HTML/JS/CSS
        types {
            text/html html;
            application/javascript js;
            text/css css;
        }
    }
    
    # Gestion des erreurs
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
    
    # Logging
    access_log /var/log/nginx/music.access.log;
    error_log /var/log/nginx/music.error.log;
}
